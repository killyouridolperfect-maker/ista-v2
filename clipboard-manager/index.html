<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d5fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クリップ帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>クリップ帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column tool. Sticky intake bar (paste box + search) on top, day-grouped cards below; tap a card = copy. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunken:#e3e8ef; --fg:#18202b; --muted:#5d6878; --line:#d4dbe4;
  --accent:#1d5fd1; --accent-fg:#ffffff; --accent-soft:#dce8fb;
  --pin:#c77700; --ok:#13804a; --ok-soft:#d9f2e4; --danger:#c8312b; --mark:#ffe58a;
  --toast-bg:#18202b; --toast-fg:#ffffff; --toast-link:#9cc3ff;
  --font-ui:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#18202a; --sunken:#212b37; --fg:#e8edf3; --muted:#97a3b3; --line:#2b3644;
  --accent:#5b97f5; --accent-fg:#0b1220; --accent-soft:#1d2d47;
  --pin:#f2b34a; --ok:#4cc98a; --ok-soft:#173a2a; --danger:#ff7a72; --mark:#6b5a12;
  --toast-bg:#e8edf3; --toast-fg:#0f141b; --toast-link:#1d5fd1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#18202a; --sunken:#212b37; --fg:#e8edf3; --muted:#97a3b3; --line:#2b3644;
  --accent:#5b97f5; --accent-fg:#0b1220; --accent-soft:#1d2d47;
  --pin:#f2b34a; --ok:#4cc98a; --ok-soft:#173a2a; --danger:#ff7a72; --mark:#6b5a12;
  --toast-bg:#e8edf3; --toast-fg:#0f141b; --toast-link:#1d5fd1; color-scheme:dark}

html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:baseline;gap:10px}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.02em}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.status.cloud .dot{background:var(--ok)}
.status.warn .dot{background:var(--pin)}

.intake{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:2px dashed var(--accent);border-radius:var(--r);padding:6px}
.intake:focus-within{border-style:solid}
#inbox{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:8px 8px;min-height:44px;max-height:30vh;font-size:16px;line-height:1.5}
#inbox::placeholder{color:var(--accent);font-weight:600}
#inbox:focus{outline:none}
#pasteBtn,#saveTyped{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:0 16px;font-weight:700;white-space:nowrap}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 180px;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:6px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.count{font:500 12px var(--font-data);color:var(--muted);font-variant-numeric:tabular-nums}

main .wrap{padding-block:6px 120px}
.day{display:flex;align-items:center;gap:10px;margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--muted)}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.list{display:flex;flex-direction:column;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:background-color .2s,border-color .2s}
.card.pinned{border-color:color-mix(in srgb,var(--pin) 55%,var(--line))}
.card.copied{background:var(--ok-soft);border-color:var(--ok)}
.hit{display:block;width:100%;text-align:left;padding:12px 14px 4px;min-width:0}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card.open .txt{display:block}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.meta{display:flex;align-items:center;gap:2px;padding:0 6px 6px 14px;min-height:42px}
.stamp{flex:1;font:500 12px var(--font-data);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center;min-width:0}
.done{display:none;font:700 12px var(--font-ui);color:var(--ok)}
.card.copied .done{display:inline}
.ib{width:42px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--sunken)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--pin)} .ib.on svg{fill:currentColor}
.ib.more{width:auto;padding:0 10px;font-size:13px;font-weight:600}

.empty{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.empty h2{margin:0 0 12px;font-size:16px}
.empty ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
.empty p{margin:0;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(640px,100%);padding:16px;display:flex;flex-direction:column;gap:12px;max-height:90vh}
.sheet h2{margin:0;font-size:16px}
#editTa{width:100%;min-height:40vh;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical;font-size:16px;line-height:1.55}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:12px;background:var(--sunken);font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-fg)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--toast-bg);color:var(--toast-fg);border-radius:12px;padding:12px 16px;display:flex;gap:16px;align-items:center;z-index:40;
  transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#undo{color:var(--toast-link);font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.foot .btn{font-size:14px;padding:9px 14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>クリップ帳</h1>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">読み込み中…</span></div>
    </div>
    <div class="intake">
      <textarea id="inbox" rows="1" placeholder="またはここに貼り付け" aria-label="貼り付けて保存"></textarea>
      <button id="saveTyped" hidden>保存</button>
      <button id="pasteBtn">＋ 貼り付け</button>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="履歴を検索" aria-label="履歴を検索">
      <div class="chips">
        <button class="chip" id="fAll" aria-pressed="true">すべて</button>
        <button class="chip" id="fPin" aria-pressed="false">★ ピン</button>
      </div>
      <span class="count" id="count"></span>
    </div>
  </div>
</header>

<main><div class="wrap"><div id="list"></div>
  <div class="foot"><button class="btn" id="expBtn">バックアップを保存</button><button class="btn" id="impBtn">バックアップから戻す</button>
  <input type="file" id="impFile" accept="application/json,.json" hidden></div></div></main>

<div class="scrim" id="editor" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h2 id="editTitle">編集</h2>
    <textarea id="editTa" aria-label="内容"></textarea>
    <div class="row">
      <button class="btn" id="editCancel">キャンセル</button>
      <button class="btn primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undo" hidden>元に戻す</button></div>

<script src="app.js"></script>
</body>
</html>
