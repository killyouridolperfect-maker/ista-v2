<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>クリップ履歴</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#111827;--sub:#6b7280;--line:#e5e7eb;--pri:#2563eb;--priText:#fff;--pin:#f59e0b;--danger:#dc2626;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d24;--text:#f3f4f6;--sub:#9ca3af;--line:#2a2e37;--pri:#3b82f6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.primary{background:var(--pri);color:var(--priText);padding:12px 16px;border-radius:12px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-top:8px;align-items:center}
.tab{padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sp{flex:1}
.mini{font-size:13px;color:var(--sub);padding:6px 8px}
main{padding:10px 14px 120px;max-width:720px;margin:0 auto}
.day{font-size:13px;color:var(--sub);margin:16px 4px 6px;font-weight:700}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:background .15s}
.item.flash{background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.body{display:block;width:100%;text-align:left;padding:12px 14px 6px}
.txt{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item.open .txt{-webkit-line-clamp:unset}
.meta{display:flex;align-items:center;gap:4px;padding:0 6px 6px 14px;color:var(--sub);font-size:12px}
.meta .t{flex:1}
.ic{width:40px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}
.ic:active{background:var(--line)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.on{color:var(--pin)}.ic.on svg{fill:var(--pin)}
.ic.del:active{color:var(--danger)}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;display:flex;gap:14px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#93c5fd;font-weight:700}
dialog{border:0;border-radius:18px;padding:0;width:min(640px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:16px;display:flex;flex-direction:column;gap:12px}
textarea{width:100%;min-height:42vh;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:16px/1.5 inherit;resize:vertical}
.btns{display:flex;gap:8px;justify-content:flex-end}
.btns button{padding:12px 18px;border-radius:12px;background:var(--line);font-weight:600}
.btns .primary{background:var(--pri)}
h2{margin:0;font-size:16px}
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="q" type="search" placeholder="検索" aria-label="検索">
    <button class="primary" id="paste">＋ 貼り付け保存</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-f="all">すべて</button>
    <button class="tab" data-f="pin">★ ピン留め</button>
    <span class="sp"></span>
    <button class="mini" id="menu">バックアップ</button>
  </div>
</header>
<main id="list"></main>
<div id="toast"><span id="tmsg"></span><button id="undo" hidden>元に戻す</button></div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dtitle">編集</h2>
    <textarea id="ta" aria-label="内容"></textarea>
    <div class="btns">
      <button value="cancel" type="button" id="cancel">キャンセル</button>
      <button class="primary" value="ok" id="save">保存</button>
    </div>
  </form>
</dialog>
<dialog id="bk">
  <form method="dialog">
    <h2>バックアップ</h2>
    <p style="margin:0;color:var(--sub);font-size:14px">データはこの端末のブラウザ内にだけ保存されます。ブラウザのデータ削除で消えるため、定期的に書き出してください。</p>
    <div class="btns" style="justify-content:flex-start;flex-wrap:wrap">
      <button type="button" id="exp">書き出し (JSON)</button>
      <button type="button" id="imp">読み込み</button>
      <button type="button" id="clr" style="color:var(--danger)">ピン以外を全削除</button>
    </div>
    <div class="btns"><button value="close">閉じる</button></div>
    <input type="file" id="file" accept="application/json" hidden>
  </form>
</dialog>

<script>
const KEY='clipmgr.v1', MAX=2000;
const $=s=>document.querySelector(s);
let items=load(), filter='all', query='', lastClip='';

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){toast('保存容量がいっぱいです。古い履歴を削除してください')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function add(text){
  text=text.replace(/\s+$/,'');
  if(!text.trim())return false;
  const dup=items.find(i=>i.text===text);
  if(dup){dup.ts=Date.now();items.sort(cmp);save();render();return 'dup'}
  items.unshift({id:uid(),text,ts:Date.now(),pin:false});
  if(items.length>MAX){const keep=items.filter(i=>i.pin);const rest=items.filter(i=>!i.pin).slice(0,MAX-keep.length);items=[...keep,...rest].sort(cmp)}
  save();render();return true;
}
const cmp=(a,b)=>b.ts-a.ts;

async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();return ok;
}

let tTimer,undoFn;
function toast(msg,undo){
  $('#tmsg').textContent=msg;undoFn=undo;$('#undo').hidden=!undo;
  $('#toast').classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>$('#toast').classList.remove('show'),undo?5000:1600);
}
$('#undo').onclick=()=>{undoFn&&undoFn();$('#toast').classList.remove('show')};

function dayLabel(ts){
  const d=new Date(ts),n=new Date(),s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((s(n)-s(d))/864e5);
  if(diff===0)return'今日';if(diff===1)return'昨日';
  return d.getFullYear()===n.getFullYear()?`${d.getMonth()+1}月${d.getDate()}日`:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const svg=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const I={star:svg('<path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/>'),
 edit:svg('<path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13 7l4 4"/>'),
 del:svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
 more:svg('<path d="M6 9l6 6 6-6"/>')};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(){
  const q=query.trim().toLowerCase();
  const list=items.filter(i=>(filter==='all'||i.pin)&&(!q||i.text.toLowerCase().includes(q))).sort(cmp);
  const el=$('#list');
  if(!list.length){el.innerHTML=`<div class="empty">${items.length?'見つかりません':'まだ履歴がありません<br>コピーしたら「＋ 貼り付け保存」を押してください'}</div>`;return}
  let html='',last='';
  for(const i of list){
    const d=dayLabel(i.ts);if(d!==last){html+=`<div class="day">${d}</div>`;last=d}
    html+=`<div class="item" data-id="${i.id}">
      <button class="body" data-a="copy"><div class="txt">${esc(i.text)}</div></button>
      <div class="meta"><span class="t">${hm(i.ts)} ・ ${i.text.length}文字</span>
        ${i.text.length>90||i.text.split('\n').length>3?`<button class="ic" data-a="open" aria-label="全文表示">${I.more}</button>`:''}
        <button class="ic ${i.pin?'on':''}" data-a="pin" aria-label="ピン留め">${I.star}</button>
        <button class="ic" data-a="edit" aria-label="編集">${I.edit}</button>
        <button class="ic del" data-a="del" aria-label="削除">${I.del}</button></div></div>`;
  }
  el.innerHTML=html;
}

$('#list').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const card=b.closest('.item'),it=items.find(x=>x.id===card.dataset.id);if(!it)return;
  const a=b.dataset.a;
  if(a==='copy'){
    const ok=await copy(it.text);
    if(ok){card.classList.add('flash');setTimeout(()=>card.classList.remove('flash'),500);lastClip=it.text;toast('コピーしました ✓')}else toast('コピーできませんでした');
  }else if(a==='open'){card.classList.toggle('open')}
  else if(a==='pin'){it.pin=!it.pin;save();render()}
  else if(a==='edit'){openEdit(it)}
  else if(a==='del'){
    const idx=items.indexOf(it);items.splice(idx,1);save();render();
    toast('削除しました',()=>{items.splice(idx,0,it);save();render()});
  }
});

let editing=null;
function openEdit(it){editing=it;$('#dtitle').textContent='編集';$('#ta').value=it.text;$('#dlg').showModal();$('#ta').focus()}
$('#cancel').onclick=()=>$('#dlg').close();
$('#form').addEventListener('submit',e=>{
  if(e.submitter&&e.submitter.id==='save'&&editing){
    const v=$('#ta').value;
    if(!v.trim()){e.preventDefault();toast('空にはできません');return}
    editing.text=v;save();render();toast('保存しました ✓');
  }
});

async function pasteSave(auto){
  let text='';
  try{text=await navigator.clipboard.readText()}
  catch(e){
    if(auto)return;
    editing=null;$('#dtitle').textContent='ここに貼り付けて保存';$('#ta').value='';
    $('#dlg').showModal();$('#ta').focus();
    $('#form').addEventListener('submit',function h(ev){
      $('#form').removeEventListener('submit',h);
      if(ev.submitter&&ev.submitter.id==='save'){const r=add($('#ta').value);toast(r?'保存しました ✓':'空です')}
    });
    return;
  }
  if(!text||text===lastClip&&auto)return;
  lastClip=text;
  const r=add(text);
  if(r===true)toast('保存しました ✓');else if(r==='dup')toast('既に保存済み（先頭に移動）');else if(!auto)toast('クリップボードが空です');
}
$('#paste').onclick=()=>pasteSave(false);
// アプリを開いた/戻ってきた時、権限があれば自動で取り込み
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pasteSave(true)});
window.addEventListener('focus',()=>pasteSave(true));

$('#q').addEventListener('input',e=>{query=e.target.value;render()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));filter=t.dataset.f;render()});

$('#menu').onclick=()=>$('#bk').showModal();
$('#exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(items,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='clip-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;
    const have=new Set(items.map(i=>i.text));let n=0;
    for(const x of arr)if(x&&typeof x.text==='string'&&!have.has(x.text)){items.push({id:uid(),text:x.text,ts:+x.ts||Date.now(),pin:!!x.pin});have.add(x.text);n++}
    items.sort(cmp);save();render();toast(n+'件を読み込みました');
  }catch(_){toast('読み込めないファイルです')}
  e.target.value='';
};
$('#clr').onclick=()=>{
  if(!confirm('ピン留め以外の履歴をすべて削除します。よろしいですか？'))return;
  const bak=items;items=items.filter(i=>i.pin);save();render();$('#bk').close();toast('削除しました',()=>{items=bak;save();render()});
};

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
pasteSave(true);
</script>
</body>
</html>
