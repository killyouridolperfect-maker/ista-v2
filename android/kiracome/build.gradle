plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as Integer

android {
    namespace 'app.kiracome'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kiracome'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../app/clipcho.keystore')
            storePassword 'clipcho'
            keyAlias 'clipcho'
            keyPassword 'clipcho'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
