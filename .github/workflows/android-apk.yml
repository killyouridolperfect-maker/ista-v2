name: Build Android APK

on:
  push:
    branches: [claude/clipboard-manager-app-9e4zvg]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ../clipcho.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: クリップ帳 Android 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            スマホのChromeで次のURLを開くとダウンロードできます（常に最新版）:
            https://github.com/${{ github.repository }}/releases/latest/download/clipcho.apk
          files: clipcho.apk
